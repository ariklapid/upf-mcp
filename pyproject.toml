[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "upf-mcp"
version = "0.1.0a0"
description = "Deterministic MCP server for Unified Power Format power-intent engineering."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ariel Lapid" },
]
maintainers = [
  { name = "Ariel Lapid" },
]
requires-python = ">=3.11"
keywords = [
  "eda",
  "ieee-1801",
  "mcp",
  "model-context-protocol",
  "power-intent",
  "upf",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/ariklapid/upf-mcp"
Repository = "https://github.com/ariklapid/upf-mcp"
Issues = "https://github.com/ariklapid/upf-mcp/issues"
Documentation = "https://github.com/ariklapid/upf-mcp#readme"

[project.scripts]
upf-mcp = "upf_mcp.__main__:main"

[project.optional-dependencies]
dev = [
  "pyright>=1.1.408,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/upf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingModuleSource = false
